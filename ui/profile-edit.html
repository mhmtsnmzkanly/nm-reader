<!doctype html>
<html lang="tr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Gelişmiş Arama | Manga.app</title>
        <!-- Tailwind CSS for Styling -->
        <script src="https://cdn.tailwindcss.com"></script>
        <!-- jQuery for Interactivity -->
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <!-- Lucide Icons -->
        <script src="https://unpkg.com/lucide@latest"></script>

        <style>
            @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap");

            body {
                font-family: "Inter", sans-serif;
                background-color: #080808;
                color: #e3e2e6;
                display: flex;
                flex-direction: column;
                min-height: 100vh;
            }

            .glass {
                background: rgba(10, 10, 10, 0.7);
                backdrop-filter: blur(20px);
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            }

            /* Footer Specific Styles */
            .footer-title {
                font-size: 11px;
                font-weight: 900;
                text-transform: uppercase;
                letter-spacing: 0.2em;
                color: #ffffff;
                margin-bottom: 1.5rem;
                display: block;
            }

            .footer-item-link {
                display: flex;
                align-items: center;
                gap: 0.75rem;
                padding: 0.5rem 0;
                transition: all 0.2s;
            }

            .footer-item-link:hover {
                transform: translateX(4px);
            }

            .type-dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
            }

            /* Tag Cloud Styling */
            .tag-cloud {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                justify-content: center;
                padding: 20px 0;
            }

            .footer-tag {
                background: rgba(255, 255, 255, 0.03);
                border: 1px solid rgba(255, 255, 255, 0.05);
                padding: 0.5rem 1rem;
                border-radius: 12px;
                font-size: 11px;
                font-weight: 700;
                text-transform: uppercase;
                color: #94a3b8;
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                cursor: pointer;
            }

            .footer-tag:hover {
                background: #3b82f6;
                color: white;
                border-color: #3b82f6;
                transform: translateY(-3px) scale(1.05);
                box-shadow: 0 10px 20px -5px rgba(59, 130, 246, 0.4);
            }

            /* Modals Common Styles */
            .modal-overlay {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.8);
                backdrop-filter: blur(8px);
                z-index: 200;
                align-items: center;
                justify-content: center;
                animation: fadeIn 0.3s ease-out;
            }

            #user-modal {
                display: none;
                animation: fadeIn 0.2s ease-out;
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(-10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .user-menu-item {
                display: flex;
                align-items: center;
                gap: 0.75rem;
                padding: 0.75rem 1rem;
                border-radius: 12px;
                transition: all 0.2s;
                color: #94a3b8;
                font-size: 0.75rem;
                font-weight: 700;
                text-transform: uppercase;
                cursor: pointer;
            }

            .user-menu-item:hover {
                background: rgba(255, 255, 255, 0.05);
                color: white;
            }

            /* Profile Edit Modal Specifics */
            .edit-input {
                width: 100%;
                background: rgba(255, 255, 255, 0.05);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 16px;
                padding: 12px 16px;
                color: white;
                font-size: 13px;
                outline: none;
                transition: all 0.2s;
            }

            .edit-input:focus {
                border-color: #3b82f6;
                background: rgba(255, 255, 255, 0.08);
            }

            /* Readonly / Disabled Style */
            .edit-input-locked {
                background: rgba(255, 255, 255, 0.02);
                border-color: transparent;
                color: #64748b;
                cursor: not-allowed;
            }

            .edit-label {
                font-size: 10px;
                font-weight: 900;
                text-transform: uppercase;
                letter-spacing: 0.1em;
                color: #4b5563;
                margin-bottom: 6px;
                display: block;
            }
        </style>
    </head>
    <body class="overflow-x-hidden">
        <!-- HEADER -->
        <header
            class="fixed top-0 w-full z-[100] h-20 glass flex items-center px-4 md:px-8 justify-between"
        >
            <div
                class="flex items-center gap-3 cursor-pointer"
                onclick="location.reload()"
            >
                <div
                    class="w-10 h-10 bg-blue-600 rounded-2xl flex items-center justify-center font-black italic text-white shadow-lg shadow-blue-600/20"
                >
                    M
                </div>
                <span
                    class="font-black tracking-tighter text-xl uppercase italic text-white"
                    >MANGA.APP</span
                >
            </div>

            <nav class="hidden lg:flex items-center gap-10">
                <a
                    href="#"
                    class="text-[11px] font-black uppercase tracking-widest text-gray-400 hover:text-white transition-colors"
                    >ANASAYFA</a
                >
                <a
                    href="#"
                    class="text-[11px] font-black uppercase tracking-widest text-blue-500 border-b-2 border-blue-600 pb-1"
                    >KEŞFET</a
                >
                <a
                    href="#"
                    class="text-[11px] font-black uppercase tracking-widest text-gray-400 hover:text-white transition-colors"
                    >KÜTÜPHANE</a
                >
            </nav>

            <div class="flex items-center gap-3 md:gap-5">
                <div class="relative">
                    <button
                        id="user-btn"
                        class="flex items-center gap-2 p-1 pr-3 bg-white/5 border border-white/10 rounded-2xl hover:bg-white/10 transition-all"
                    >
                        <div
                            class="w-8 h-8 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-[10px] font-black text-white"
                        >
                            NA
                        </div>
                        <i
                            data-lucide="chevron-down"
                            class="w-4 h-4 text-gray-500 hidden md:block"
                        ></i>
                    </button>
                    <div
                        id="user-modal"
                        class="absolute right-0 mt-4 w-64 bg-[#121212] border border-white/10 rounded-3xl shadow-2xl p-4"
                    >
                        <div class="px-3 py-4 border-b border-white/5 mb-2">
                            <p
                                class="text-[10px] font-black text-blue-500 uppercase tracking-widest mb-1"
                            >
                                HOŞ GELDİN
                            </p>
                            <p
                                class="text-sm font-black text-white italic uppercase"
                            >
                                Necmi Admin
                            </p>
                        </div>
                        <div class="space-y-1">
                            <div id="open-profile-edit" class="user-menu-item">
                                <i
                                    data-lucide="user"
                                    class="w-4 h-4 text-blue-500"
                                ></i>
                                Profilimi Düzenle
                            </div>
                            <a href="#" class="user-menu-item"
                                ><i
                                    data-lucide="shield-check"
                                    class="w-4 h-4 text-red-500"
                                ></i>
                                Admin Panel</a
                            >
                            <a href="#" class="user-menu-item"
                                ><i
                                    data-lucide="settings"
                                    class="w-4 h-4 text-gray-400"
                                ></i>
                                Ayarlar</a
                            >
                            <div class="h-px bg-white/5 my-2"></div>
                            <a href="#" class="user-menu-item text-red-500"
                                ><i data-lucide="log-out" class="w-4 h-4"></i>
                                Çıkış Yap</a
                            >
                        </div>
                    </div>
                </div>
                <button
                    id="menu-toggle"
                    class="lg:hidden w-10 h-10 bg-white/5 rounded-xl flex items-center justify-center border border-white/10"
                >
                    <i data-lucide="menu" class="w-6 h-6 text-white"></i>
                </button>
            </div>
        </header>

        <!-- PROFILE EDIT MODAL -->
        <div id="profile-edit-overlay" class="modal-overlay">
            <div
                class="bg-[#0f0f0f] border border-white/10 w-full max-w-md rounded-[40px] p-8 shadow-2xl relative"
            >
                <button
                    id="close-profile-edit"
                    class="absolute top-6 right-6 text-gray-500 hover:text-white transition-colors"
                >
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>

                <div class="mb-8 text-center sm:text-left">
                    <h2
                        class="text-2xl font-black italic uppercase tracking-tighter text-white"
                    >
                        PROFİLİ DÜZENLE
                    </h2>
                    <p
                        class="text-gray-500 text-[10px] font-black uppercase tracking-widest italic"
                    >
                        Hesap bilgilerini ve biyografini yönet
                    </p>
                </div>

                <div class="flex justify-center mb-8">
                    <div
                        class="relative group cursor-pointer"
                        title="Profil Fotoğrafını Değiştir"
                    >
                        <div
                            class="w-24 h-24 rounded-[32px] bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-3xl font-black italic text-white shadow-xl"
                        >
                            NA
                        </div>
                        <div
                            class="absolute inset-0 bg-black/60 rounded-[32px] flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity border-2 border-blue-500/50"
                        >
                            <i
                                data-lucide="camera"
                                class="w-6 h-6 text-white"
                            ></i>
                        </div>
                    </div>
                </div>

                <div class="space-y-5">
                    <div>
                        <div class="flex items-center justify-between mb-1.5">
                            <label class="edit-label mb-0">Kullanıcı Adı</label>
                            <i
                                data-lucide="lock"
                                class="w-3 h-3 text-gray-700"
                            ></i>
                        </div>
                        <input
                            type="text"
                            class="edit-input edit-input-locked"
                            value="Necmi Admin"
                            readonly
                        />
                    </div>
                    <div>
                        <div class="flex items-center justify-between mb-1.5">
                            <label class="edit-label mb-0"
                                >E-posta Adresi</label
                            >
                            <i
                                data-lucide="lock"
                                class="w-3 h-3 text-gray-700"
                            ></i>
                        </div>
                        <input
                            type="email"
                            class="edit-input edit-input-locked"
                            value="necmi@manga.app"
                            readonly
                        />
                    </div>
                    <div>
                        <label class="edit-label"
                            >Biyografi (Düzenlenebilir)</label
                        >
                        <textarea
                            class="edit-input h-24 resize-none"
                            placeholder="Kendinizden bahsedin..."
                        >
Manga okumayı ve sistem geliştirmeyi seviyorum.</textarea
                        >
                    </div>
                </div>

                <div class="mt-10 flex flex-col sm:flex-row gap-4">
                    <button
                        class="flex-1 bg-white/5 hover:bg-white/10 text-gray-400 font-black uppercase tracking-widest text-[10px] py-4 rounded-2xl transition-all"
                        onclick="$('#profile-edit-overlay').fadeOut()"
                    >
                        Kapat
                    </button>
                    <button
                        class="flex-[2] bg-blue-600 hover:bg-blue-700 text-white font-black uppercase tracking-widest text-[10px] py-4 rounded-2xl shadow-lg shadow-blue-600/20 transition-all active:scale-95"
                    >
                        Güncellemeleri Kaydet
                    </button>
                </div>
            </div>
        </div>

        <main class="pt-32 pb-20 px-6 max-w-7xl mx-auto flex-grow">
            <!-- Content Area -->
            <div class="mb-12">
                <h1
                    class="text-4xl md:text-5xl font-black italic uppercase tracking-tighter text-white mb-4"
                >
                    GELİŞMİŞ ARAMA
                </h1>
                <p
                    class="text-gray-500 text-sm font-medium uppercase tracking-widest italic"
                >
                    Keşfetmeye Hazır mısın?
                </p>
            </div>
            <!-- Mock Content Grid -->
            <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-6">
                <div
                    class="bg-white/5 aspect-[3/4.5] rounded-3xl border border-white/5 flex items-center justify-center text-gray-700 font-black italic"
                >
                    CARD
                </div>
                <div
                    class="bg-white/5 aspect-[3/4.5] rounded-3xl border border-white/5 flex items-center justify-center text-gray-700 font-black italic"
                >
                    CARD
                </div>
                <div
                    class="bg-white/5 aspect-[3/4.5] rounded-3xl border border-white/5 flex items-center justify-center text-gray-700 font-black italic"
                >
                    CARD
                </div>
                <div
                    class="bg-white/5 aspect-[3/4.5] rounded-3xl border border-white/5 flex items-center justify-center text-gray-700 font-black italic"
                >
                    CARD
                </div>
                <div
                    class="bg-white/5 aspect-[3/4.5] rounded-3xl border border-white/5 flex items-center justify-center text-gray-700 font-black italic"
                >
                    CARD
                </div>
                <div
                    class="bg-white/5 aspect-[3/4.5] rounded-3xl border border-white/5 flex items-center justify-center text-gray-700 font-black italic"
                >
                    CARD
                </div>
            </div>
        </main>

        <!-- FOOTER -->
        <footer class="pt-20 pb-10 bg-[#0a0a0a] border-t border-white/5 px-6">
            <div class="max-w-7xl mx-auto text-center">
                <p
                    class="text-gray-600 text-[10px] font-bold uppercase tracking-widest"
                >
                    © 2026 MANGA.APP
                </p>
            </div>
        </footer>

        <script>
            $(document).ready(function () {
                lucide.createIcons();

                // User dropdown toggles
                $("#user-btn").click(function (e) {
                    e.stopPropagation();
                    $("#user-modal").fadeToggle(150);
                });

                $(document).click(function () {
                    $("#user-modal").fadeOut(150);
                });

                // Profile Edit Modal functionality
                $("#open-profile-edit").click(function (e) {
                    e.preventDefault();
                    $("#user-modal").fadeOut(150);
                    $("#profile-edit-overlay")
                        .css("display", "flex")
                        .hide()
                        .fadeIn(300);
                });

                $("#close-profile-edit").click(function () {
                    $("#profile-edit-overlay").fadeOut(300);
                });

                // Close modal when clicking on overlay
                $("#profile-edit-overlay").click(function (e) {
                    if (e.target === this) {
                        $(this).fadeOut(300);
                    }
                });
            });
        </script>
    </body>
</html>
