<!doctype html>
<html lang="tr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Aksiyon Serileri | Manga.app</title>
        <!-- Tailwind CSS -->
        <script src="https://cdn.tailwindcss.com"></script>
        <!-- jQuery -->
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <!-- Lucide Icons -->
        <script src="https://unpkg.com/lucide@latest"></script>

        <style>
            @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap");

            body {
                font-family: "Inter", sans-serif;
                background-color: #080808;
                color: #e3e2e6;
                min-height: 100vh;
            }

            .glass {
                background: rgba(10, 10, 10, 0.7);
                backdrop-filter: blur(20px);
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            }

            /* Manga Card Improvements */
            .manga-card {
                transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            }

            .manga-card:hover {
                transform: translateY(-10px);
            }

            .manga-image-container {
                position: relative;
                aspect-ratio: 2/3;
                border-radius: 24px;
                overflow: hidden;
                border: 1px solid rgba(255, 255, 255, 0.05);
                background: #121212;
            }

            .manga-image-container img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                transition: transform 0.6s;
            }

            .manga-card:hover img {
                transform: scale(1.1);
            }

            .card-overlay {
                position: absolute;
                inset: 0;
                background: linear-gradient(
                    to top,
                    rgba(0, 0, 0, 0.9) 0%,
                    transparent 60%
                );
                opacity: 0;
                transition: opacity 0.3s;
                display: flex;
                align-items: flex-end;
                padding: 20px;
            }

            .manga-card:hover .card-overlay {
                opacity: 1;
            }

            /* Custom Scrollbar */
            ::-webkit-scrollbar {
                width: 6px;
            }
            ::-webkit-scrollbar-track {
                background: #080808;
            }
            ::-webkit-scrollbar-thumb {
                background: #1a1a1a;
                border-radius: 10px;
            }
            ::-webkit-scrollbar-thumb:hover {
                background: #3b82f6;
            }

            .filter-btn.active {
                background: #3b82f6;
                color: white;
                border-color: #3b82f6;
            }

            /* Language Dropdown Styles */
            .lang-dropdown {
                opacity: 0;
                visibility: hidden;
                transform: translateY(10px);
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }

            .lang-container:hover .lang-dropdown {
                opacity: 1;
                visibility: visible;
                transform: translateY(0);
            }
        </style>
    </head>
    <body>
        <!-- HEADER -->
        <header
            class="fixed top-0 w-full z-[100] h-20 glass flex items-center px-4 md:px-8 justify-between"
        >
            <div
                class="flex items-center gap-3 cursor-pointer"
                onclick="window.location.href = 'index.html'"
            >
                <div
                    class="w-10 h-10 bg-blue-600 rounded-2xl flex items-center justify-center font-black italic text-white shadow-lg shadow-blue-600/20"
                >
                    M
                </div>
                <span
                    class="font-black tracking-tighter text-xl uppercase italic text-white"
                    >MANGA.APP</span
                >
            </div>

            <nav class="hidden lg:flex items-center gap-10">
                <a
                    href="index.html"
                    class="text-[11px] font-black uppercase tracking-widest text-gray-400 hover:text-white transition-colors"
                    >ANASAYFA</a
                >
                <a
                    href="genres.html"
                    class="text-[11px] font-black uppercase tracking-widest text-blue-500"
                    >TÜRLER</a
                >
                <a
                    href="#"
                    class="text-[11px] font-black uppercase tracking-widest text-gray-400 hover:text-white transition-colors"
                    >YENİLER</a
                >
            </nav>

            <div class="flex items-center gap-4">
                <!-- Search Button -->
                <button
                    class="p-2 text-gray-400 hover:text-white transition-colors"
                >
                    <i data-lucide="search" class="w-5 h-5"></i>
                </button>

                <!-- Language Selector -->
                <div class="lang-container relative">
                    <button
                        class="flex items-center gap-2 bg-white/5 border border-white/10 px-3 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest text-gray-400 hover:text-white transition-all"
                    >
                        <i data-lucide="languages" class="w-3.5 h-3.5"></i>
                        <span id="active-lang">TR</span>
                        <i
                            data-lucide="chevron-down"
                            class="w-3 h-3 text-gray-600"
                        ></i>
                    </button>

                    <!-- Dropdown Menu -->
                    <div
                        class="lang-dropdown absolute top-full right-0 mt-2 w-32 bg-[#121212] border border-white/10 rounded-2xl overflow-hidden shadow-2xl py-2"
                    >
                        <button
                            class="w-full flex items-center justify-between px-4 py-2.5 text-[10px] font-black uppercase tracking-widest text-white hover:bg-blue-600 transition-colors"
                            onclick="setLanguage('TR')"
                        >
                            Türkçe <span>🇹🇷</span>
                        </button>
                        <button
                            class="w-full flex items-center justify-between px-4 py-2.5 text-[10px] font-black uppercase tracking-widest text-gray-400 hover:text-white hover:bg-white/5 transition-colors"
                            onclick="setLanguage('EN')"
                        >
                            English <span>🇺🇸</span>
                        </button>
                    </div>
                </div>

                <!-- User Profile -->
                <div
                    class="w-10 h-10 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-gray-500 hover:text-white hover:border-blue-600 transition-all cursor-pointer"
                >
                    <i data-lucide="user" class="w-5 h-5"></i>
                </div>
            </div>
        </header>

        <main class="pt-32 pb-20 px-6 max-w-7xl mx-auto">
            <!-- Category Header -->
            <div class="relative mb-16">
                <div
                    class="flex flex-col md:flex-row md:items-end justify-between gap-8"
                >
                    <div>
                        <div class="flex items-center gap-2 text-blue-500 mb-4">
                            <i data-lucide="swords" class="w-5 h-5"></i>
                            <span
                                class="text-[10px] font-black uppercase tracking-[0.4em]"
                                >Tür Dosyası</span
                            >
                        </div>
                        <h1
                            class="text-5xl md:text-7xl font-black italic uppercase tracking-tighter text-white"
                        >
                            AKSİYON
                        </h1>
                        <p
                            class="text-gray-500 mt-4 max-w-xl font-medium leading-relaxed italic"
                        >
                            Heyecan dolu dövüş sahneleri, bitmek bilmeyen
                            maceralar ve adrenalin patlaması yaşayan
                            kahramanların dünyasına hoş geldin.
                        </p>
                    </div>
                    <div
                        class="flex items-center gap-4 bg-white/5 p-2 rounded-2xl border border-white/5"
                    >
                        <div
                            class="px-6 py-3 text-center border-r border-white/10"
                        >
                            <div class="text-xl font-black text-white italic">
                                1,240
                            </div>
                            <div
                                class="text-[8px] font-black text-gray-500 uppercase tracking-widest"
                            >
                                SERİ
                            </div>
                        </div>
                        <div class="px-6 py-3 text-center">
                            <div
                                class="text-xl font-black text-blue-500 italic"
                            >
                                4.8
                            </div>
                            <div
                                class="text-[8px] font-black text-gray-500 uppercase tracking-widest"
                            >
                                ORT. PUAN
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Filters & Sorting -->
            <div
                class="flex flex-col md:flex-row justify-between items-center gap-6 mb-12 border-b border-white/5 pb-8"
            >
                <div
                    class="flex items-center gap-3 overflow-x-auto w-full md:w-auto pb-2 md:pb-0"
                >
                    <button
                        class="filter-btn active px-6 py-2.5 rounded-xl border border-white/10 text-[10px] font-black uppercase tracking-widest whitespace-nowrap transition-all"
                    >
                        Popüler
                    </button>
                    <button
                        class="filter-btn px-6 py-2.5 rounded-xl border border-white/10 text-[10px] font-black uppercase tracking-widest whitespace-nowrap transition-all text-gray-500 hover:text-white hover:border-white/20"
                    >
                        En Yeniler
                    </button>
                    <button
                        class="filter-btn px-6 py-2.5 rounded-xl border border-white/10 text-[10px] font-black uppercase tracking-widest whitespace-nowrap transition-all text-gray-500 hover:text-white hover:border-white/20"
                    >
                        Puan
                    </button>
                    <button
                        class="filter-btn px-6 py-2.5 rounded-xl border border-white/10 text-[10px] font-black uppercase tracking-widest whitespace-nowrap transition-all text-gray-500 hover:text-white hover:border-white/20"
                    >
                        Tamamlanmış
                    </button>
                </div>

                <div class="flex items-center gap-4 w-full md:w-auto">
                    <div class="relative flex-grow md:w-64">
                        <i
                            data-lucide="filter"
                            class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-600"
                        ></i>
                        <select
                            class="w-full bg-white/5 border border-white/10 rounded-xl py-3 pl-12 pr-4 text-[10px] font-black uppercase tracking-widest outline-none focus:border-blue-600 transition-all appearance-none cursor-pointer"
                        >
                            <option>Tüm Alt Etiketler</option>
                            <option>Sistem</option>
                            <option>Zindan</option>
                            <option>Reenkarnasyon</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Manga Grid -->
            <div
                class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-8"
            >
                <!-- Manga Item 1 -->
                <div
                    class="manga-card group cursor-pointer"
                    onclick="window.location.href = 'SeriesDetail.jsx'"
                >
                    <div class="manga-image-container mb-4 shadow-2xl">
                        <img
                            src="https://images.unsplash.com/photo-1618336753974-aae8e04506aa?q=80&w=600"
                            alt="Solo Leveling"
                        />
                        <div class="absolute top-4 left-4 flex flex-col gap-2">
                            <span
                                class="bg-blue-600 text-white text-[8px] font-black px-2 py-1 rounded-lg uppercase tracking-tighter"
                                >YENİ</span
                            >
                            <span
                                class="bg-orange-600 text-white text-[8px] font-black px-2 py-1 rounded-lg uppercase tracking-tighter"
                                >TREND</span
                            >
                        </div>
                        <div class="card-overlay">
                            <button
                                class="w-full bg-white text-black py-3 rounded-xl font-black italic text-[10px] uppercase tracking-widest transform translate-y-4 group-hover:translate-y-0 transition-transform"
                            >
                                HEMEN OKU
                            </button>
                        </div>
                    </div>
                    <h3
                        class="font-black uppercase italic text-sm truncate text-white group-hover:text-blue-500 transition-colors"
                    >
                        Solo Leveling
                    </h3>
                    <div class="flex items-center justify-between mt-1">
                        <p
                            class="text-[9px] text-gray-500 font-bold uppercase tracking-widest"
                        >
                            182 Bölüm
                        </p>
                        <div
                            class="flex items-center gap-1 text-[10px] text-yellow-500 font-black"
                        >
                            <i
                                data-lucide="star"
                                class="w-3 h-3 fill-current"
                            ></i>
                            4.9
                        </div>
                    </div>
                </div>

                <!-- Diğer Kartlar -->
                <script>
                    const series = [
                        {
                            title: "The Breaker",
                            chapters: 210,
                            rating: 4.8,
                            img: "https://images.unsplash.com/photo-1541562232579-512a21360020?q=80&w=400",
                        },
                        {
                            title: "Tower of God",
                            chapters: 550,
                            rating: 4.7,
                            img: "https://images.unsplash.com/photo-1614850523296-d8c1af93d400?q=80&w=400",
                        },
                        {
                            title: "Nano Machine",
                            chapters: 180,
                            rating: 4.9,
                            img: "https://images.unsplash.com/photo-1618336753974-aae8e04506aa?q=80&w=401",
                        },
                        {
                            title: "Mercenary Enrollment",
                            chapters: 150,
                            rating: 4.6,
                            img: "https://images.unsplash.com/photo-1614850523296-d8c1af93d400?q=80&w=402",
                        },
                        {
                            title: "Magic Emperor",
                            chapters: 420,
                            rating: 4.8,
                            img: "https://images.unsplash.com/photo-1541562232579-512a21360020?q=80&w=403",
                        },
                        {
                            title: "SSS-Class Suicide Hunter",
                            chapters: 100,
                            rating: 4.9,
                            img: "https://images.unsplash.com/photo-1618336753974-aae8e04506aa?q=80&w=404",
                        },
                        {
                            title: "Eleceed",
                            chapters: 240,
                            rating: 4.9,
                            img: "https://images.unsplash.com/photo-1614850523296-d8c1af93d400?q=80&w=405",
                        },
                        {
                            title: "The Beginning After the End",
                            chapters: 175,
                            rating: 4.8,
                            img: "https://images.unsplash.com/photo-1541562232579-512a21360020?q=80&w=406",
                        },
                        {
                            title: "God of High School",
                            chapters: 560,
                            rating: 4.5,
                            img: "https://images.unsplash.com/photo-1618336753974-aae8e04506aa?q=80&w=407",
                        },
                    ];

                    series.forEach((m) => {
                        document.write(`
                        <div class="manga-card group cursor-pointer">
                            <div class="manga-image-container mb-4 shadow-2xl">
                                <img src="${m.img}" alt="${m.title}">
                                <div class="card-overlay">
                                    <button class="w-full bg-white text-black py-3 rounded-xl font-black italic text-[10px] uppercase tracking-widest transform translate-y-4 group-hover:translate-y-0 transition-transform">HEMEN OKU</button>
                                </div>
                            </div>
                            <h3 class="font-black uppercase italic text-sm truncate text-white group-hover:text-blue-500 transition-colors">${m.title}</h3>
                            <div class="flex items-center justify-between mt-1">
                                <p class="text-[9px] text-gray-500 font-bold uppercase tracking-widest">${m.chapters} Bölüm</p>
                                <div class="flex items-center gap-1 text-[10px] text-yellow-500 font-black"><i data-lucide="star" class="w-3 h-3 fill-current"></i> ${m.rating}</div>
                            </div>
                        </div>
                    `);
                    });
                </script>
            </div>

            <!-- Pagination -->
            <div class="mt-20 flex justify-center items-center gap-2">
                <button
                    class="w-12 h-12 rounded-xl bg-white/5 border border-white/5 flex items-center justify-center text-gray-500 hover:bg-white/10 transition-all"
                >
                    <i data-lucide="chevron-left" class="w-5 h-5"></i>
                </button>
                <button
                    class="w-12 h-12 rounded-xl bg-blue-600 text-white font-black text-sm shadow-lg shadow-blue-600/20"
                >
                    1
                </button>
                <button
                    class="w-12 h-12 rounded-xl bg-white/5 border border-white/5 text-gray-400 font-black text-sm hover:bg-white/10 transition-all"
                >
                    2
                </button>
                <button
                    class="w-12 h-12 rounded-xl bg-white/5 border border-white/5 text-gray-400 font-black text-sm hover:bg-white/10 transition-all"
                >
                    3
                </button>
                <span class="text-gray-700 px-2 font-black">...</span>
                <button
                    class="w-12 h-12 rounded-xl bg-white/5 border border-white/5 text-gray-400 font-black text-sm hover:bg-white/10 transition-all"
                >
                    42
                </button>
                <button
                    class="w-12 h-12 rounded-xl bg-white/5 border border-white/5 flex items-center justify-center text-gray-500 hover:bg-white/10 transition-all"
                >
                    <i data-lucide="chevron-right" class="w-5 h-5"></i>
                </button>
            </div>
        </main>

        <!-- FOOTER -->
        <footer
            class="pt-20 pb-12 bg-[#050505] border-t border-white/5 px-6 md:px-12"
        >
            <div class="max-w-7xl mx-auto text-center">
                <div
                    class="w-12 h-12 bg-blue-600 rounded-2xl flex items-center justify-center font-black italic text-white mx-auto mb-6"
                >
                    M
                </div>
                <p
                    class="text-gray-800 text-[9px] font-black uppercase tracking-[0.5em]"
                >
                    © 2026 MANGA.APP EXPERIENCE
                </p>
            </div>
        </footer>

        <script>
            // Language Switcher Function
            function setLanguage(lang) {
                document.getElementById("active-lang").innerText = lang;
                // Buraya gerçek dil değiştirme mantığı (i18n) gelebilir.
                console.log("Seçilen dil:", lang);
            }

            $(document).ready(function () {
                lucide.createIcons();

                // Filter buttons toggle
                $(".filter-btn").click(function () {
                    $(".filter-btn")
                        .removeClass("active text-white")
                        .addClass("text-gray-500");
                    $(this)
                        .addClass("active text-white")
                        .removeClass("text-gray-500");
                });
            });
        </script>
    </body>
</html>
